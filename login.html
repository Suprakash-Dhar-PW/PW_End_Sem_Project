    <!-- Background Video -->

        <source src="videos/PW_LOGIN.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.

    <div class="overlay"></div>

    <!-- Loading Animation -->

            <div class="spinner-ring"></div>
            <div class="spinner-ring"></div>
        </div>

    </div>

    <!-- Enhanced Login Form -->

            </div>

        <div class="form-container">
            <h2>Welcome Back</h2>

            <form onsubmit="return validate(event)" class="login-form">
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>

                        <div class="input-focus-border"></div>
                    </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" placeholder="Password" id="pwd" required />
                        <i class="fa-solid fa-eye toggle-password" id="togglePwd"></i>
                        <div class="input-focus-border"></div>
                    </div>
                    <small id="pwdError" class="error-msg"></small>
                </div>

                <div class="options-row">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe" />
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <div class="btn-loader" id="btnLoader">
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                        <div class="loader-dot"></div>
                    </div>
                </button>
            </form>

            <div class="divider">

            </div>

            <div class="social-login">

                </button>

                <button class="social-btn github-btn">

            </div>
        </div>

        <div class="footer-section">
            <div class="signup-link">
                Don't have an account?
                <a href="sign-up.html" class="signup-btn">Create Account</a>
            </div>
            <div class="footer-text">© 2024 Physics Wallah Institute of Innovation</div>
        </div>

    <!-- Notification Container -->

    // Show Notification
    function showNotification(message, type = 'info') {
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i>
            <span>${message}</span>
            <button class="notification-close" onclick="this.parentElement.remove()">
                <i class="fas fa-times"></i>
            </button>
        `;
        
        notificationContainer.appendChild(notification);
        
        setTimeout(() => {
            notification.classList.add('show');
        }, 100);

        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => notification.remove(), 300);
        }, 4000);
    }

    // In your login.html <script> tag

async function validate(event) {
    event.preventDefault();
    let valid = true;

    // Reset previous errors for a clean slate
    emailError.textContent = "";
    pwdError.textContent = "";
    email.classList.remove("input-error");
    pwd.classList.remove("input-error");

    // --- Step 1: Front-end validation ---
    // Email validation
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email.value)) {
        emailError.textContent = "Please enter a valid email address.";
        email.classList.add("input-error");
        valid = false;
    }

    // Password validation
    const password = pwd.value;
    const hasUppercase = /[A-Z]/.test(password);
    const hasNumber = /[0-9]/.test(password);
    const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

    if (!hasUppercase || !hasNumber || !hasSpecialChar || password.length < 8) {
        pwdError.textContent = "Password must be at least 8 characters and include an uppercase letter, a number, and a special character.";
        pwd.classList.add("input-error");
        valid = false;
    }

    // --- Step 2: If front-end validation passes, contact the server ---
    if (valid) {
        // Show loading state on the button
        loginBtn.classList.add('loading');
        btnText.style.opacity = '0';
        btnLoader.style.display = 'flex';

        try {
            // 🔗 Point this to your Flask server's address
            const response = await fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    email: email.value,
                    password: pwd.value
                })
            });

            const result = await response.json(); // Get the JSON response from the server

            // 🧠 Handle the server's response
            if (response.ok) { // response.ok is true if status is 200-299
                showNotification('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = "index.html"; // Redirect on success
                }, 1500);
            } else {
                // Show the error message sent from the server (e.g., "Invalid email or password.")
                showNotification(result.message, 'error');
                loginBtn.classList.remove('loading'); // Stop the loading animation
                btnText.style.opacity = '1';          // This line was added
                btnLoader.style.display = 'none';     // This line was added
            }

        } catch (error) {
            // This catches network errors (e.g., server is not running)
            console.error("Fetch Error:", error);
            showNotification('Could not connect to the server. Please try again.', 'error');
            loginBtn.classList.remove('loading'); // Stop the loading animation
            btnText.style.opacity = '1';          // This line was added
            btnLoader.style.display = 'none';     // This line was added
        }

    } else {
        // If front-end validation fails, show a general error notification
        showNotification('Please fix the errors above', 'error');
    }

    // Prevent the default HTML form submission behavior
    return false;
}

    // Live password validation and strength
    pwd.addEventListener("input", function () {
        const password = this.value;
        const hasUppercase = /[A-Z]/.test(password);
        const hasNumber = /[0-9]/.test(password);
        const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

        if (hasUppercase && hasNumber && hasSpecialChar && password.length >= 8) {
            pwdError.textContent = "";
            this.classList.remove("input-error");
        }
    });

    // Password toggle
    const pwdField = document.getElementById("pwd");
    const togglePwd = document.getElementById("togglePwd");

    togglePwd.addEventListener("click", function () {
        const type = pwdField.getAttribute("type") === "password" ? "text" : "password";
        pwdField.setAttribute("type", type);

        this.classList.toggle("fa-eye");
        this.classList.toggle("fa-eye-slash");
    });

    // Input focus effects
    document.querySelectorAll('.input-wrapper input').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('focused');
        });
        
        input.addEventListener('blur', function() {
            if (!this.value) {
                this.parentElement.classList.remove('focused');
            }
        });
    });

    // Social button interactions
    document.querySelectorAll('.social-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            showNotification('Social login feature coming soon!', 'info');
        });
    });

    // Remember me functionality
    document.getElementById('rememberMe').addEventListener('change', function() {
        if (this.checked) {
            showNotification('Login credentials will be remembered', 'info');
        }
    });

    // Forgot password link
    document.querySelector('.forgot-link').addEventListener('click', function(e) {
        e.preventDefault();
        showNotification('Password reset feature coming soon!', 'info');
